# Mosquitto for diskenzy. Two listeners:
#   1883 — plain MQTT, published on the host's loopback only (debugging)
#   9001 — MQTT over WebSocket, what the site uses, fronted by the tunnel
#
# There is no TLS here on purpose: the tunnel terminates TLS at Cloudflare's
# edge and speaks plain HTTP/WebSocket to the origin, same as it does for the
# bot and the backend.

listener 1883
protocol mqtt

listener 9001
protocol websockets

# The site has no login — the browsers are anonymous, like on the public
# brokers this replaces. What keeps this one from being a free relay for the
# internet is the ACL: every client may only touch diskenzy/# topics.
allow_anonymous true
acl_file /mosquitto/config/acl

# Retained cards (presence, call members, call meta, the Rift map) survive a
# broker restart. Without this, every container update would drop the state
# everyone's session quietly depends on.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# Abuse limits. It is a public endpoint behind Cloudflare; a client may be
# weird, but not expensive. Message size covers any card or signaling message
# several times over — a WebRTC SDP is a few KB.
message_size_limit 262144
max_inflight_messages 20
max_queued_messages 1000
