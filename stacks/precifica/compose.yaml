# Precifica: pricing sheet for the restaurant — recipe cost, CMV and unit DRE
# per dish, in a single spreadsheet-style page.
#
# The deploy does not use Docker Hub: the image travels over SSH (`docker save
# | docker load`) from the app repo (6.precifica, scripts/deploy.sh). The
# canonical copy of this compose lives in 6.precifica/deploy/compose.yaml —
# keep this one in sync.

services:
  precifica:
    image: brittinho/precifica:${PRECIFICA_VERSION}
    container_name: precifica
    restart: unless-stopped

    # Reached from the home LAN (phone/desktop). Public port 8765.
    # To expose on the internet, follow the pattern of the other stacks: `edge`
    # network + cloudflared, no published port.
    ports:
      - "8765:3000"

    # SQLite outside the image: rolling back a version does not touch the data.
    volumes:
      - ./data:/app/data

    # Native Node healthcheck: fetch exists in node:26-slim, so the image does
    # not depend on wget/curl.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s