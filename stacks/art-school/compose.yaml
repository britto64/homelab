services:
  artschool:
    image: brittinho/artschool:1.0.1
    container_name: artschool
    restart: unless-stopped
    ports:
      - "${ARTSCHOOL_PORT}:3000"
    volumes:
      - ${COURSES_HOST_PATH}:/courses:ro
      - ${DATA_HOST_PATH}:/app/data
    environment:
      COURSES_PATH: /courses
      DATA_PATH: /app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
