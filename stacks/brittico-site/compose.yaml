# The Brittico site: the /kennzy/ pages, moved off brittinho.com's shared host
# and onto this box. Static files behind nginx — no database, no state.
#
# This is the first stack here whose content is the product. If it is down, the
# site is down; there is no shared host still serving a copy once phase 4 of the
# migration completes. Until then brittinho.com/kennzy/ is the fallback.

services:
  site:
    image: brittinho/brittico-site:${SITE_VERSION}
    container_name: brittico-site
    restart: unless-stopped
    # Reached through the tunnel on the `edge` network, not from the LAN — same
    # as britticobot and brittinho-backend. No port published.
    networks:
      - edge
    volumes:
      # The Godot export of the island: index.wasm alone is 38 MB. It is kept
      # out of the image on purpose, so a site release does not drag 38 MB of
      # unchanged game with it and a new game export does not need a site
      # release. :ro — nginx never writes.
      #
      # If this path is empty the rest of the site still works; only
      # /kennzy/ilha/ shows a broken frame.
      - ${ILHA_GAME_HOST_PATH}:/usr/share/nginx/html/kennzy/ilha/game:ro
    healthcheck:
      # Not "/": that would follow the redirect to /kennzy/ and prove more than
      # this service can promise. /healthz is a fixed 200 from nginx itself,
      # which is the honest signal here — there is no database to consult.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Shared network so the tunnel can resolve the services it fronts by name.
  # Declared external: it is created once, by hand, and outlives every stack:
  #   docker network create edge
  # Without it each stack would land on its own bridge and cloudflared could
  # not reach anything — which is the price of splitting the stacks apart.
  edge:
    external: true
