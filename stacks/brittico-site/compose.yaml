# The Brittico site: brittico.xyz, moved off brittinho.com's shared host and
# onto this box. Static files behind nginx — no database, no state.
#
# This is the first stack here whose content is the product. If it is down, the
# site is down; there is no shared host still serving a copy once the migration
# retires the old paths. Until then brittinho.com/kennzy/ is the fallback.

services:
  site:
    image: brittinho/brittico-site:${SITE_VERSION}
    container_name: brittico-site
    restart: unless-stopped
    # Reached through the tunnel on the `edge` network, not from the LAN — same
    # as britticobot and brittinho-backend. No port published.
    networks:
      - edge
    # No volumes. The image is the whole service: every file it serves is baked
    # in, so a rollback to an older tag rolls back the content with it.
    healthcheck:
      # /healthz is a fixed 200 from nginx itself, which is the honest signal
      # here — unlike the bot's, there is no database behind this to consult,
      # so there is nothing more for the check to prove.
      #
      # 127.0.0.1 and not `localhost`, which is what reported this container
      # unhealthy for half an hour while it served every page correctly:
      # `listen 80` binds IPv4 only, and inside the container `localhost` can
      # resolve to ::1 first. The bot survives the identical check because Node
      # opens a dual-stack socket — an accident, not a design, so do not read
      # its version of this line as the one to copy.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Shared network so the tunnel can resolve the services it fronts by name.
  # Declared external: it is created once, by hand, and outlives every stack:
  #   docker network create edge
  # Without it each stack would land on its own bridge and cloudflared could
  # not reach anything — which is the price of splitting the stacks apart.
  edge:
    external: true
